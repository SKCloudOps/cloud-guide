<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Global chat application architecture</title>
  <desc id="desc">Diagram showing clients connected through a network load balancer to websocket servers on EKS, with Redis connection registry, SQS FIFO, DynamoDB, OpenSearch, S3, and SNS mobile push.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <rect x="40" y="32" width="1120" height="90" rx="24" fill="url(#banner)"/>
  <text x="76" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">System Design: Global Chat Application</text>
  <text x="76" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e9d5ff">Persistent WebSocket connections, ordered delivery, and offline push notifications.</text>

  <g filter="url(#shadow)">
    <rect x="68" y="228" width="176" height="110" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="156" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">Clients</text>
    <text x="156" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Web and mobile chat</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="304" y="228" width="202" height="110" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="405" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#9a3412">NLB</text>
    <text x="405" y="300" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Layer 4 WebSocket entry</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="560" y="150" width="258" height="182" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="689" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1d4ed8">EKS WebSocket Servers</text>
    <text x="689" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">1M concurrent connections</text>
    <rect x="596" y="240" width="184" height="34" rx="10" fill="#dbeafe"/>
    <text x="688" y="262" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#1e3a8a">Connection handling</text>
    <rect x="596" y="286" width="184" height="34" rx="10" fill="#ede9fe"/>
    <text x="688" y="308" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6d28d9">Message fan-out</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="878" y="132" width="232" height="92" rx="22" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="994" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#155e75">Redis</text>
    <text x="994" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Connection registry and presence</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="878" y="250" width="232" height="92" rx="22" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="994" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#854d0e">SQS FIFO</text>
    <text x="994" y="316" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Per-conversation ordering</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="878" y="368" width="232" height="92" rx="22" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <text x="994" y="406" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#be123c">DynamoDB</text>
    <text x="994" y="434" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Message store and receipts</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="878" y="486" width="232" height="92" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="994" y="524" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#166534">SNS + S3 + Search</text>
    <text x="994" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Offline push, files, and indexing</text>
  </g>

  <line x1="244" y1="283" x2="304" y2="283" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="506" y1="283" x2="560" y2="242" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="818" y1="190" x2="878" y2="178" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="818" y1="236" x2="878" y2="296" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="818" y1="258" x2="878" y2="414" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="818" y1="278" x2="878" y2="532" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="92" y="558" width="664" height="104" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="122" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Delivery flow</text>
  <text x="122" y="626" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Persist message, enqueue ordered delivery, look up recipient server in Redis, then push via WebSocket or SNS if offline.</text>
</svg>
