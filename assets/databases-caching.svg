<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Caching strategies with ElastiCache, DAX, and CloudFront</title>
  <desc id="desc">Diagram showing application traffic flowing to CloudFront, Redis, DAX, Memcached, DynamoDB, and a relational database, with cache-aside, write-through, and TTL callouts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" x2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <rect x="40" y="34" width="1120" height="92" rx="24" fill="url(#hero)"/>
  <text x="76" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Caching Patterns: ElastiCache, DAX, and Edge Caching</text>
  <text x="76" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dbeafe">Use Redis or Memcached for hot reads, DAX for DynamoDB acceleration, and CloudFront for edge responses.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="196" width="196" height="108" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="170" y="238" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Clients</text>
    <text x="170" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Web, mobile, APIs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="342" y="174" width="230" height="94" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="457" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#9a3412">CloudFront</text>
    <text x="457" y="242" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7c2d12">Static assets and cached API responses</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="342" y="312" width="230" height="108" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="457" y="354" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8">Application</text>
    <text x="457" y="384" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Cache-aside and write logic</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="154" width="220" height="108" rx="22" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="770" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#155e75">ElastiCache Redis</text>
    <text x="770" y="226" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Sessions, leaderboards, pub/sub</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="296" width="220" height="108" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="770" y="338" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#166534">ElastiCache Memcached</text>
    <text x="770" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Simple distributed key-value cache</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="438" width="220" height="108" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="770" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#6d28d9">DAX</text>
    <text x="770" y="510" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Microsecond cache for DynamoDB reads</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="952" y="250" width="176" height="108" rx="22" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="1040" y="292" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#854d0e">DynamoDB</text>
    <text x="1040" y="322" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Read-heavy key-value</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="952" y="410" width="176" height="108" rx="22" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <text x="1040" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#be123c">RDS or Aurora</text>
    <text x="1040" y="482" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Source of truth</text>
  </g>

  <line x1="268" y1="250" x2="342" y2="221" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="268" y1="250" x2="342" y2="366" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="572" y1="366" x2="660" y2="208" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="572" y1="366" x2="660" y2="350" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="572" y1="366" x2="660" y2="492" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="880" y1="492" x2="952" y2="304" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="880" y1="350" x2="952" y2="464" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>

  <g>
    <rect x="82" y="560" width="320" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="108" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Cache-aside</text>
    <text x="108" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">1. Check cache</text>
    <text x="108" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">2. On miss, read database</text>
    <text x="108" y="676" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">3. Populate cache with TTL</text>
  </g>

  <g>
    <rect x="440" y="560" width="320" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="466" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Write-through</text>
    <text x="466" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Writes update cache and database together</text>
    <text x="466" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Good when freshly written data must stay hot</text>
  </g>

  <g>
    <rect x="798" y="560" width="330" height="110" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="824" y="598" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">TTL and invalidation</text>
    <text x="824" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Prevent stale reads by expiring hot keys</text>
    <text x="824" y="652" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Tune freshness versus hit rate</text>
  </g>
</svg>
