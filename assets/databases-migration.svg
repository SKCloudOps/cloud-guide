<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">AWS database migration with SCT and DMS</title>
  <desc id="desc">Diagram showing a source database moving through schema conversion and continuous replication into an AWS target database, with cutover and validation stages.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fbfdff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" x2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <rect x="40" y="34" width="1120" height="92" rx="24" fill="url(#banner)"/>
  <text x="76" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Database Migration: Schema Conversion plus Continuous Replication</text>
  <text x="76" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#dbeafe">Use SCT for heterogeneous schema changes, then DMS for full load and low-downtime change data capture.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="210" width="210" height="124" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="181" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Source DB</text>
    <text x="181" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Oracle, SQL Server, MySQL</text>
    <text x="181" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Production writes continue</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="358" y="188" width="212" height="110" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="464" y="230" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8">AWS SCT</text>
    <text x="464" y="258" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Convert schema, code, procedures</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="358" y="334" width="212" height="110" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="464" y="376" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#166534">AWS DMS</text>
    <text x="464" y="404" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Full load plus CDC replication</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="648" y="210" width="220" height="124" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="758" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#9a3412">Target DB</text>
    <text x="758" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Aurora, RDS PostgreSQL</text>
    <text x="758" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Prepared schema and replicated data</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="936" y="210" width="184" height="124" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="1028" y="254" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#6d28d9">Cutover</text>
    <text x="1028" y="286" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Switch app traffic</text>
    <text x="1028" y="312" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">After validation lag is zero</text>
  </g>

  <line x1="286" y1="250" x2="358" y2="243" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="286" y1="290" x2="358" y2="388" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="570" y1="243" x2="648" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="570" y1="388" x2="648" y2="290" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="868" y1="250" x2="936" y2="250" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <path d="M181 346 C181 430, 764 430, 764 346" fill="none" stroke="#0f766e" stroke-width="5" stroke-dasharray="12 12" marker-end="url(#arrow)"/>
  <text x="448" y="478" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f766e">Continuous change data capture keeps target nearly in sync</text>

  <g>
    <rect x="72" y="542" width="242" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="98" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Step 1</text>
    <text x="98" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Assess compatibility</text>
    <text x="98" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Choose homogeneous or heterogeneous path</text>
  </g>

  <g>
    <rect x="332" y="542" width="242" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="358" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Step 2</text>
    <text x="358" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Run SCT for schema changes</text>
    <text x="358" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Move stored procedures and SQL dialects</text>
  </g>

  <g>
    <rect x="592" y="542" width="242" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="618" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Step 3</text>
    <text x="618" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Use DMS full load plus CDC</text>
    <text x="618" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Validate row counts and replication lag</text>
  </g>

  <g>
    <rect x="852" y="542" width="276" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="878" y="582" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Step 4</text>
    <text x="878" y="612" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Cut over during a small change window</text>
    <text x="878" y="638" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Keep rollback plan until verification is complete</text>
  </g>
</svg>
