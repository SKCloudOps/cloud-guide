<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Architecture interview question themes</title>
  <desc id="desc">Illustration showing the main architecture interview question categories including event-driven systems, migration, three-tier design, CAP theorem, active-active, CQRS, and sagas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <rect x="40" y="32" width="1120" height="90" rx="24" fill="url(#banner)"/>
  <text x="76" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">Architecture Interview Questions</text>
  <text x="76" y="106" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#e9d5ff">The patterns interviewers expect you to reason about under constraints and trade-offs.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="170" width="220" height="118" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="200" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Event-Driven</text>
    <text x="200" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Fan-out, idempotency, DLQs</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="350" y="170" width="220" height="118" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="460" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Migration</text>
    <text x="460" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Strangler Fig and cutover plans</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="610" y="170" width="220" height="118" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="720" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Three-Tier</text>
    <text x="720" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Security boundaries and scaling</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="870" y="170" width="220" height="118" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="980" y="214" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">CAP Trade-offs</text>
    <text x="980" y="246" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Consistency versus availability</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="220" y="356" width="220" height="118" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="330" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1d4ed8">Active-Active</text>
    <text x="330" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Global routing and conflict handling</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="490" y="356" width="220" height="118" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="600" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#6d28d9">CQRS</text>
    <text x="600" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Read models optimized for scale</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="356" width="220" height="118" rx="22" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <text x="870" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#155e75">Saga</text>
    <text x="870" y="432" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">Compensating transactions</text>
  </g>

  <rect x="156" y="560" width="888" height="92" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="600" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Interview lens</text>
  <text x="600" y="630" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#475569">State the constraints, choose the trade-off, and explain why the compromise fits the workload.</text>
</svg>
